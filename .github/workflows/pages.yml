name: Deploy project page

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "assets/method.png"
      - "assets/main_results.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Assemble static site
        run: |
          mkdir -p _site/assets
          cp site/index.html site/styles.css site/app.js _site/
          cp assets/method.png assets/main_results.png _site/assets/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
