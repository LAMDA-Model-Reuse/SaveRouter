name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install SAVERouter
        run: python -m pip install ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: Run download-free smoke test
        run: saverouter smoke-test

  package:
    name: Build package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build distributions
        run: python -m build
      - name: Validate distributions
        run: python -m twine check dist/*
      - name: Verify the wheel in a clean environment
        run: |
          python -m venv /tmp/saverouter-wheel-test
          /tmp/saverouter-wheel-test/bin/python -m pip install dist/*.whl
          /tmp/saverouter-wheel-test/bin/saverouter smoke-test
      - uses: actions/upload-artifact@v7
        with:
          name: saverouter-distributions
          path: dist/*
          if-no-files-found: error

